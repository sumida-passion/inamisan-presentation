e{color:var(--red)}.dark .beat.active{color:#f0b481}.red .beat.active{color:#fff3e2}.hero .beats{position:static;margin-top:2vh;min-height:0}.hero .beat{font-size:clamp(22px,3.1vw,52px)}.quiet .beats{margin-top:4vh;gap:2vh}.quiet .beat{font-size:clamp(19px,2.4vw,39px);font-weight:400;transition-duration:1s}.plan .beat,.roadmap .beat{padding-left:1.4em;position:relative}.plan .beat:before,.roadmap .beat:before{content:'—';position:absolute;left:0}.chain h1{font-size:clamp(80px,15vw,220px)}.chain .beats{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:3vw;min-height:20vh}.chain .beat{font-size:clamp(55px,9vw,140px);font-weight:800}.chain .beat:last-child{width:100%;font-size:clamp(22px,3vw,44px);font-weight:500}.foot{position:absolute;left:7vw;bottom:8vh;max-width:85vw;font-size:clamp(10px,.95vw,15px);line-height:1.7;opacity:.6}.sources .beat{font-size:clamp(16px,2vw,31px)}.stamp{position:absolute;right:7vw;top:6vh;font-size:11px;letter-spacing:.14em;opacity:.45}.counter{position:absolute;bottom:3.2vh;left:7vw;font-size:12px;letter-spacing:.12em;font-variant-numeric:tabular-nums;color:inherit;opacity:.6}.hint{position:absolute;bottom:3.2vh;right:7vw;font-size:11px;letter-spacing:.06em;opacity:.55}#progress{height:3px;background:var(--red);position:fixed;bottom:0;left:0;z-index:10;transition:width .4s}nav{position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:20;background:#20241fdf;border:1px solid #ffffff25;border-radius:30px;padding:5px;opacity:0;transition:opacity .2s}nav:hover,nav:focus-within,body.controls nav{opacity:1}nav button{color:#f2efe7;border:0;background:transparent;border-radius:20px;padding:8px 13px;font-size:12px}nav button:hover{background:#ffffff20}.panel{position:fixed;inset:0;background:#20241ff5;z-index:30;padding:7vh 7vw;overflow:auto;display:none;color:var(--paper)}.panel.open{display:block}.close{position:fixed;right:4vw;top:3vh;border:1px solid #ffffff50;border-radius:50%;width:44px;height:44px;background:#20241f;color:white;font-size:24px}.panel h2{font-size:30px;margin:0 0 30px}.notes-body{font-size:clamp(17px,1.7vw,24px);line-height:1.9;max-width:1050px;white-space:pre-wrap;overflow-wrap:anywhere}.notes-body a{color:#f0b481}#overview-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}#overview-list button{border:1px solid #ffffff35;background:transparent;color:inherit;text-align:left;padding:24px;min-height:130px;font-size:19px}#overview-list button:hover{background:#ffffff13}#overview-list small{display:block;color:#f0b481;margin-bottom:12px}.blackout{position:fixed;inset:0;background:#000;z-index:100;display:none}.blackout.open{display:block}#help p{font-size:20px;line-height:2}.motion-tag{margin-top:25px;color:#aaa99e;font-size:13px}.sr{position:absolute;left:-10000px}@keyframes scene{from{opacity:0}to{opacity:1}}@media(max-width:700px){.slide{padding:10vh 7vw 15vh}.slide h1{font-size:8.7vw}.slide.impact h1{font-size:12vw}.slide.numbers h1{font-size:19vw}.slide.quiet h1{font-size:8vw}.slide.hero h1{font-size:43vw}.hero .beats{position:static;margin-top:5vh}.hero .beat{font-size:6vw}.beats{gap:2vh;min-height:26vh}.beat{font-size:5vw}.quiet .beat{font-size:4.8vw}.foot{bottom:11vh;font-size:10px}.stamp{display:none}.hint{font-size:9px;bottom:6vh}.counter{bottom:6vh}.chain .beat{font-size:15vw}.chain .beat:last-child{font-size:5vw}nav{bottom:1vh;opacity:1}.plan h1{font-size:8vw}.plan .beat{font-size:4.5vw}.sources .beat{font-size:4vw}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}@media print{html,body{height:auto;overflow:visible}.slide{position:relative;min-height:100vh;break-after:page}.beat{opacity:1!important;transform:none}nav,.panel,#progress,.hint{display:none!important}}

<script>
const slides=[{"theme": "dark", "kind": "hero", "label": "01 / 身近な疑問", "title": "卵。", "beats": ["その値段から、", "社会が見えてきた。"], "foot": "", "notes": "【発表原稿】\n今日は、卵の値上がりという身近な疑問から、私が考えたことをお話しします。調べる中で、生産だけでなく、餌や流通の仕組みまで考えるようになりました。", "original": ["卵の値上がりから考える", "買いやすい価格で", "生産者も、作り続けられる卵へ"]}, {"theme": "paper", "kind": "quiet", "label": "寮生活で感じたこと", "title": "いつもの卵が、", "beats": ["高くなっていた。", "なぜ？"], "foot": "", "notes": "【発表原稿】\n私は寮生活をしています。買い物で卵の値段を見て、以前より高くなったことが気になりました。身近な食材の値上がりが、今回調べようと思ったきっかけです。\n【事実の扱い】本人の体験はユーザー提供情報。「1年前より約100円」は購入時期・規格・店舗を示す記録が未確認のため、金額を断定していません。", "original": ["寮生活で感じた、値上がり", "いつもの買い物", "以前より高くなった卵", "なぜ、値段が上がったのか？"]}, {"theme": "paper", "kind": "numbers", "label": "価格を、確かめる", "title": "251 → 303", "beats": ["2024年9月 → 2025年9月", "1パック、52円の上昇。"], "foot": "全国平均・サイズ混合10個入り・税込。2024年9月と2025年9月の比較。", "notes": "【発表原稿】\n農林水産省の調査には、卵の小売価格が、2024年9月の251円から2025年9月には303円になった例がありました。サイズ混合の10個入りで、52円、約20.7％の上昇です。これは全国の調査店舗の平均であり、私が買った店の価格や、現在から1年前との比較ではありません。\n【出典】\n農林水産省「食品価格動向調査（食肉・鶏卵）」\nhttps://www.maff.go.jp/j/zyukyu/anpo/kouri/k_gyuniku/attach/pdf/index-59.pdf\n資料確認日：2026年10月6日", "original": ["公的な価格データでは", "2024年9月　251円", "2025年9月　303円", "1パックで52円の上昇", "全国平均・サイズ混合10個入り・税込。2024年9月と2025年9月の比較。"]}, {"theme": "red", "kind": "impact", "label": "最初の仮説", "title": "人手不足？", "beats": ["若い働き手が減っている。", "卵を作る人が、足りないのでは。"], "foot": "人手不足は、調査前に立てた仮説。", "notes": "【発表原稿】\n最初に考えたのは、養鶏場の人手不足です。少子化で若い働き手が減り、卵を作る人も足りなくなっているのではないか、と仮説を立てました。ただし、これは最初の仮説であり、人手不足が値上がりの主な原因だと確かめたわけではありません。", "original": ["最初の仮説", "養鶏場の人手不足？", "若い働き手が減っている？", "卵を作る人が足りないのでは？", "人手不足は、調査前に立てた仮説。"]}, {"theme": "dark", "kind": "stack", "label": "調べて、出会った言葉", "title": "原油価格。", "beats": ["ウクライナ情勢。", "海外の出来事が、なぜ卵に？"], "foot": "調査の途中で目にした説明。値上がりの原因は一つとは限らない。", "notes": "【発表原稿】\n調べ始めて目にしたのは、原油価格の上昇やウクライナ情勢など、海外に関わる説明でした。そこで、これは輸入する食品の話ではないのだろうか、と疑問に思いました。\n【事実の扱い】調査初期に目にした情報はユーザー提供の経緯です。現在の卵価格の主因を原油高や戦争だけに限定する説明ではありません。", "original": ["調べて、目にした説明", "原油価格", "ウクライナ情勢", "海外の出来事とのつながり", "調査の途中で目にした説明。値上がりの原因は一つとは限らない。"]}, {"theme": "paper", "kind": "numbers", "label": "卵は、国内生産中心", "title": "約95％", "beats": ["重量ベースの自給率。", "それなのに、なぜ海外の影響を？"], "foot": "約95％は過去の農水省掲載資料の概数。最新年度の値ではない。", "notes": "【発表原稿】\n私は店頭で外国産の卵をあまり見たことがありません。農林水産省に掲載された資料にも、卵の重量ベースの自給率は約95％と説明されていました。国内でこれほど生産している卵が、なぜ海外の影響を受けるのでしょうか。\n【出典】\n農林水産省掲載「食料の安定供給に係るリスク等に関する検討会」資料・図12\nhttps://www.maff.go.jp/j/zyukyu/anpo/attach/pdf/kentoukai-30.pdf\n資料確認日：2026年10月6日", "original": ["卵は、国内生産中心", "外国産の卵をあまり見ない", "重量ベースの自給率は約95％", "それなのに、なぜ海外の影響を？", "約95％は過去の農水省掲載資料の概数。最新年度の値ではない。"]}, {"theme": "paper", "kind": "stack", "label": "原因は、一つではない", "title": "コストと供給。", "beats": ["餌・資材などのコスト。", "鳥インフルエンザによる供給減。", "私は、海外とのつながりに注目した。"], "foot": "2025年度の高値について、農水省白書は供給減と堅調な需要を説明。", "notes": "【発表原稿】\n調べると、値上がりには、生産に必要な費用のほか、供給と需要の関係も関わると分かりました。農林水産省は2025年度の卵の高値について、鳥インフルエンザによる供給の減少と堅調な需要を挙げています。私は、その中でも海外とのつながりに注目しました。\n【出典】\n農林水産省「令和7年度 食料・農業・農村白書」第5章第5節\nhttps://www.maff.go.jp/j/wpaper/w_maff/r7/r7_h/trend/part1/chap5/c5_5_00.html\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["値上がりには、複数の要因", "餌や資材などのコスト", "鳥インフルエンザによる供給減", "私は、海外とのつながりに注目", "2025年度の高値について、農水省白書は供給減と堅調な需要を説明。"]}, {"theme": "dark", "kind": "impact", "label": "次の仮説", "title": "輸入すれば？", "beats": ["供給量が増える。", "価格競争が起こる。", "安く買えるようになるのでは。"], "foot": "輸入による値下がりは、検討段階の仮説。", "notes": "【発表原稿】\n一度は、海外から卵を輸入すればよいのではないかと考えました。供給が増え、価格競争が起これば、安く買えるかもしれません。ただし、この効果は輸入価格や数量、用途などの条件によって変わるため、ここでは検討する案です。", "original": ["それなら、卵を輸入？", "供給量を増やす", "価格競争が起こる", "安く買えるようになるのでは？", "輸入による値下がりは、検討段階の仮説。"]}, {"theme": "paper", "kind": "quiet", "label": "立ち止まって、考える", "title": "でも。", "beats": ["輸送費を含めても、安い？", "国内の生産者は、続けられる？"], "foot": "", "notes": "【発表原稿】\nしかし、輸入には輸送費もかかります。海外で安く買えても、日本の店頭まで運んだときに、本当に安くなるのでしょうか。また、安い輸入卵との競争で国内の生産者の利益が減り、生産を続けることが難しくなる可能性もあります。輸入すれば必ず安くなる、あるいは生産者が必ず廃業する、と決めつけることはできません。", "original": ["輸入案にも、疑問", "輸送費を含めても安い？", "国内の生産者への影響は？", "生産を続けられなくなったら？"]}, {"theme": "dark", "kind": "quiet", "label": "私が、実現したいこと", "title": "安い、その先へ。", "beats": ["おいしい国産の卵を、買いやすく。", "生産者も、続けられる価格で。"], "foot": "", "notes": "【発表原稿】\nここで、私が考えたいことがはっきりしました。おいしい国産の卵を、消費者が買いやすく、生産者も作り続けられる価格で届けるには、どうすればよいか。この問いを考えていきたいと思いました。", "original": ["私が、実現したいこと", "おいしい国産の卵を", "消費者が買いやすく", "生産者も続けられる価格で"]}, {"theme": "paper", "kind": "chain", "label": "もう一度、足元へ", "title": "卵。", "beats": ["鶏。", "餌。", "その餌は、どこから来る？"], "foot": "", "notes": "【発表原稿】\n私はもう一度、卵は国内で生産されているという点に戻りました。そして、卵そのものだけでなく、鶏が食べる餌に目を向けました。その餌まで国内で賄っているのでしょうか。", "original": ["卵の、その先を調べる", "卵を産むのは、鶏", "鶏を育てるのは、餌", "その餌は、どこから来る？"]}, {"theme": "red", "kind": "numbers", "label": "農林水産省の資料で見つけた", "title": "24％", "beats": ["日本全体の飼料自給率。", "令和7年度。畜産全体・TDNベース。"], "foot": "畜産全体の飼料・TDNベース。採卵鶏だけの自給率ではない。", "notes": "【発表原稿】\n農林水産省によると、令和7年度の日本全体の飼料自給率は24％です。これは鶏だけでなく、牛や豚などを含む畜産全体の数字です。卵は国内で生産していても、それを支える餌まで国内で賄っているとは限らないと気づきました。\n【数字の定義】飼料はTDN、可消化養分総量で換算。卵の重量ベース自給率とは対象・単位・年度が違い、二つを直接掛け算して卵の自給率を算出することはできません。\n【出典】\n農林水産省「食料自給率とは」令和7年度・飼料自給率\nhttps://www.maff.go.jp/j/zyukyu/zikyu_ritu/011.html\n資料確認日：2026年10月6日", "original": ["農林水産省の資料へ", "日本全体の飼料自給率", "24％", "令和7年度", "畜産全体の飼料・TDNベース。採卵鶏だけの自給率ではない。"]}, {"theme": "paper", "kind": "stack", "label": "国内の資源に、目を向ける", "title": "餌に、できないか。", "beats": ["規格外の野菜。", "食品加工で出る副産物。", "安く、安定して使えないか。"], "foot": "飼料への適性、栄養、安全性の確認が必要。", "notes": "【発表原稿】\nそこで、国内で手に入るものを、もっと安く餌として利用できないかと考えました。例えば規格外の野菜や、食品加工で出る副産物です。ただし、どの原料でもそのまま鶏の餌にできるわけではありません。必要な栄養、安全性、集まる量を確かめる必要があります。\n【出典】\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["国内の資源を、餌にできないか", "規格外の野菜", "食品加工で出る副産物", "安く、安定して使えないか？", "飼料への適性、栄養、安全性の確認が必要。"]}, {"theme": "dark", "kind": "impact", "label": "すでにある仕組み", "title": "エコフィード。", "beats": ["食品の副産物などを、飼料に。", "乾燥・発酵などで加工する。", "養鶏で、どう活用できるだろう。"], "foot": "加工方法によって対象家畜が異なる。採卵鶏への適用を確認する。", "notes": "【発表原稿】\nこうした食品の副産物などを利用する、エコフィードという取組がすでにあります。農林水産省の資料では、乾燥、発酵、液化などの方法が整理されています。ただし、方法によって適する家畜は異なります。私は、養鶏に合う原料と加工方法を調べたいと考えています。\n【出典】\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["すでにある、エコフィード", "食品の副産物などを飼料に", "乾燥・発酵などで加工", "養鶏で、どう活用できるか？", "加工方法によって対象家畜が異なる。採卵鶏への適用を確認する。"]}, {"theme": "paper", "kind": "stack", "label": "原料が安ければ、それでいい？", "title": "届くまで、いくら。", "beats": ["集める。加工する。", "保管する。運ぶ。", "流通全体の費用を、考える。"], "foot": "", "notes": "【発表原稿】\n原料が安く手に入っても、集め、加工し、保管して、養鶏場まで運ぶ費用がかかります。さらに、国内で出る副産物でも、元の食品原料が輸入品なら、完全に海外依存がなくなるわけではありません。費用も原料の出どころも、全体を見る必要があります。\n【出典】\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["原料が安くても、費用はかかる", "集める・加工する", "保管する・運ぶ", "餌として届くまで、いくら？"]}, {"theme": "paper", "kind": "quiet", "label": "濃縮果汁の発想から", "title": "水分を減らす？", "beats": ["運ぶ費用は、減るかもしれない。", "加工する費用は、増えるかもしれない。", "両方を比べて、確かめたい。"], "foot": "乾燥による節約効果は仮説。設備費・燃料費も含めて比較する。", "notes": "【発表原稿】\nここで思い浮かべたのが、濃縮果汁のように、水分を減らして運ぶという発想です。飼料も加工方法や運び方の工夫で費用を減らせるのではないでしょうか。ただし、乾燥には設備や燃料が必要です。農林水産省も、乾燥飼料は保存性に優れる一方、初期投資や加工費が大きいと説明しています。輸送費が下がっても、それ以上に加工費が増えれば、全体では安くなりません。\n【出典】\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["運び方を、変えられないか", "濃縮果汁の発想から", "水分を減らして運ぶ？", "加工費と輸送費を比べる", "乾燥による節約効果は仮説。設備費・燃料費も含めて比較する。"]}, {"theme": "dark", "kind": "roadmap", "label": "実現までの道筋", "title": "一歩ずつ、確かめる。", "beats": ["短期　地域を調べる。", "中期　小規模に試す。", "長期　仕組みを広げる。"], "foot": "以下は私の検討案。効果や採算は、これから確かめる。", "notes": "【発表原稿】\n一度に全国の仕組みを変えることは難しいため、短期・中期・長期に分けて考えました。短期に条件を調べ、中期に実証し、その結果を基に長期の整備を判断するという道筋です。具体的な年数は、調査や試験に必要な期間を踏まえて考えます。", "original": ["短期・中期・長期の道筋", "短期　地域を調べる", "中期　小規模に試す", "長期　効果のある仕組みを広げる", "以下は私の検討案。効果や採算は、これから確かめる。"]}, {"theme": "paper", "kind": "plan", "label": "短期 / 調査", "title": "地域を、知る。", "beats": ["食品工場と養鶏場を探す。", "原料の量・品質・距離を調べる。", "既存設備で試せる相手を見つける。"], "foot": "検討案。短期の目標は、実現可能性を調べること。", "notes": "【発表原稿】\n短期には、地域でどのような食品の副産物が、どれだけ、どの時期に出るかを調べます。食品工場と養鶏場の距離、現在の処理方法も確認します。まずは既存の設備で小規模な試験ができる協力先を探し、実現できそうな条件を絞りたいです。", "original": ["短期：地域を調べる", "食品工場と養鶏場を探す", "原料の量・品質・距離を調べる", "既存設備で試せる相手を見つける", "検討案。短期の目標は、実現可能性を調べること。"]}, {"theme": "paper", "kind": "plan", "label": "中期 / 実証", "title": "小さく、試す。", "beats": ["専門家と栄養・安全性を確認する。", "回収・加工・配送を実証する。", "費用・産卵量・品質を比較する。"], "foot": "検討案。試験結果を基に、継続・改善・中止を判断する。", "notes": "【発表原稿】\n中期には、協力する食品工場と養鶏場を絞り、専門家と栄養や安全性を確認したうえで、回収、加工、配送の仕組みを試します。今の方法と比べて費用が下がるか、産卵量や卵の品質を維持できるかも確かめます。餌1キロの価格だけでなく、卵を生産するための費用全体で判断したいです。", "original": ["中期：小規模に試す", "専門家と栄養・安全性を確認", "回収・加工・配送を実証", "費用と、産卵量・品質を比較", "検討案。試験結果を基に、継続・改善・中止を判断する。"]}, {"theme": "dark", "kind": "plan", "label": "長期 / インフラ整備", "title": "続く仕組みを、作る。", "beats": ["加工・保管設備と共同配送。", "品質基準・供給契約・費用分担。", "効果を確かめてから、広げる。"], "foot": "検討案。効果を確認してから整備の規模を判断する。", "notes": "【発表原稿】\n長期には、試験で効果が確認できた地域で、必要な加工、保管設備や共同配送の仕組みを整えます。設備だけでなく、品質基準、供給契約、費用を誰が負担するかも決める必要があります。大きな施設を造ることを目的にせず、必要な規模を見極め、補助が終わっても続けられるかを考えます。", "original": ["長期：必要なインフラを整える", "加工・保管設備と共同配送", "品質基準・供給契約・費用分担", "続けられる地域の仕組みへ", "検討案。効果を確認してから整備の規模を判断する。"]}, {"theme": "paper", "kind": "quiet", "label": "まだ、答えを出せていない", "title": "だから、学びたい。", "beats": ["どれだけ集めれば、採算が合う？", "何キロ先まで、運べる？", "誰が投資し、どう利益を分ける？"], "foot": "", "notes": "【発表原稿】\nここまで考えましたが、どれだけの量を集めれば採算が合うのか、何キロ先まで運べるのか、設備費を誰が負担するのかは、まだ分かりません。地域内で利用する方法と、加工して広く運ぶ方法も比較したいです。また、生産費を下げられても、店頭価格にどう反映されるかは別に確かめる必要があります。", "original": ["大学で、確かめたい条件", "どれだけ集めれば採算が合う？", "何キロ先まで運べる？", "誰が投資し、どう利益を分ける？"]}, {"theme": "dark", "kind": "final", "label": "大学で、経済と流通を学ぶ", "title": "身近な疑問を、", "beats": ["実現可能な提案へ。", "消費者と生産者、両方の未来を考えたい。"], "foot": "", "notes": "【発表原稿】\n卵の値上がりを調べる中で、生産、貿易、飼料、物流がつながっていることを知りました。そして、比較すべき条件が見えてきました。大学では、経済や流通の仕組み、データを使って効果を確かめる方法を学びたいです。消費者と生産者の双方を考え、身近な疑問から生まれたこの問いを、実現可能な提案へと発展させたいと考えています。", "original": ["大学で、経済と流通を学びたい", "費用全体を、数字で比較する", "消費者と生産者の両方を考える", "身近な疑問を、実現可能な提案へ"]}, {"theme": "paper", "kind": "sources", "label": "根拠を示すことも、探究の一部", "title": "参考資料", "beats": ["農林水産省｜食品価格動向調査・白書", "農林水産省｜食料自給率・検討会資料", "農林水産省｜エコフィードをめぐる情勢"], "foot": "出典URLと数字の対象・期間は各スライドのノートに記載。", "notes": "【発表原稿】\n本発表で参照した資料です。各スライドのノートにも、該当する出典のURLと数字の意味を記載しています。短期・中期・長期の道筋は、資料に基づいて考えた私の検討案であり、効果が実証された計画ではありません。\n【出典】\n農林水産省「食品価格動向調査（食肉・鶏卵）」\nhttps://www.maff.go.jp/j/zyukyu/anpo/kouri/k_gyuniku/attach/pdf/index-59.pdf\n農林水産省掲載「食料の安定供給に係るリスク等に関する検討会」資料・図12\nhttps://www.maff.go.jp/j/zyukyu/anpo/attach/pdf/kentoukai-30.pdf\n農林水産省「食料自給率とは」令和7年度・飼料自給率\nhttps://www.maff.go.jp/j/zyukyu/zikyu_ritu/011.html\n農林水産省「令和7年度 食料・農業・農村白書」第5章第5節\nhttps://www.maff.go.jp/j/wpaper/w_maff/r7/r7_h/trend/part1/chap5/c5_5_00.html\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["参考資料", "農林水産省　食品価格動向調査・白書", "農林水産省　食料自給率・検討会資料", "農林水産省　エコフィードをめぐる情勢", "出典URLと数字の対象・期間は各スライドのノートに記載。"]}];
let index=0,step=0,lastFocus=null;const stage=document.querySelector('#stage');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hashRead(){const m=location.hash.match(/^#(\d+)(?:\.(\d+))?$/);if(m){index=Math.max(0,Math.min(slides.length-1,+m[1]-1));step=Math.min(slides[index].beats.length,Math.max(0,+(m[2]||0)));}}
function render(){const s=slides[index];stage.innerHTML=`<section class="slide ${s.theme} ${s.kind}"><div class="eyebrow">${esc(s.label)}</div><span class="stamp">問いから、未来へ。 / INQUIRY</span><h1>${esc(s.title)}</h1><div class="beats">${s.beats.map((b,i)=>`<p class="beat" data-beat="${i+1}">${esc(b)}</p>`).join('')}</div><div class="foot">${esc(s.foot)}</div><div class="counter">${String(index+1).padStart(2,'0')} / ${slides.length}</div><div class="hint">クリック / → で次の言葉へ</div></section>`;requestAnimationFrame(()=>requestAnimationFrame(update));updateNotes();}
function update(){stage.querySelectorAll('.beat').forEach((el,i)=>{el.classList.toggle('shown',i<step);el.classList.toggle('past',i<step-1);el.classList.toggle('active',i===step-1);el.setAttribute('aria-hidden',String(i>=step));});document.querySelector('#progress').style.width=((index+step/(slides[index].beats.length+1))/slides.length*100)+'%';history.replaceState(null,'',`#${index+1}.${step}`);document.querySelector('#live').textContent=step?slides[index].beats[step-1]:slides[index].title;}
function next(){if(step<slides[index].beats.length){step++;update()}else if(index<slides.length-1){index++;step=0;render()}}
function prev(){if(step>0){step--;update()}else if(index>0){index--;step=slides[index].beats.length;render()}}
function updateNotes(){document.querySelector('#notes-title').textContent=`${String(index+1).padStart(2,'0')} / ${slides[index].title}`;document.querySelector('#notes-body').innerHTML=esc(slides[index].notes).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);}
function closePanels(){document.querySelectorAll('.panel.open').forEach(p=>p.classList.remove('open'));stage.inert=false;document.querySelector('nav').inert=false;if(lastFocus){lastFocus.focus();lastFocus=null}}
function panel(id){const p=document.getElementById(id);if(p.classList.contains('open'))return closePanels();closePanels();lastFocus=document.activeElement;p.classList.add('open');stage.inert=true;document.querySelector('nav').inert=true;p.querySelector('button').focus()}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{});}
stage.addEventListener('click',next);document.querySelector('#next').onclick=next;document.querySelector('#prev').onclick=prev;document.querySelector('#notes-btn').onclick=()=>panel('notes');document.querySelector('#overview-btn').onclick=()=>panel('overview');document.querySelector('#help-btn').onclick=()=>panel('help');document.querySelector('#fullscreen').onclick=fullscreen;document.querySelectorAll('.close').forEach(b=>b.onclick=closePanels);document.querySelector('#blackout').onclick=()=>document.querySelector('#blackout').classList.remove('open');
document.querySelector('#overview-list').innerHTML=slides.map((s,i)=>`<button data-slide="${i}"><small>${String(i+1).padStart(2,'0')} / ${esc(s.label)}</small>${esc(s.title)}</button>`).join('');document.querySelector('#overview-list').onclick=e=>{const b=e.target.closest('button');if(!b)return;index=+b.dataset.slide;step=0;closePanels();render()};
addEventListener('keydown',e=>{const key=e.key.toLowerCase(),open=document.querySelector('.panel.open');if(key==='escape'){closePanels();document.querySelector('#blackout').classList.remove('open');return}if(open){if(key==='tab'){const items=[...open.querySelectorAll('button,a')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(key==='b'){document.querySelector('#blackout').classList.toggle('open');return}if(document.querySelector('#blackout.open'))return;if(e.target.closest('button')&&[' ','enter'].includes(key))return;if(['arrowright',' ','pagedown'].includes(key)){e.preventDefault();next()}else if(['arrowleft','pageup'].includes(key)){e.preventDefault();prev()}else if(key==='n')panel('notes');else if(key==='o')panel('overview');else if(key==='f')fullscreen();else if(key==='?')panel('help');else if(key==='home'||key==='end'){index=key==='home'?0:slides.length-1;step=0;render()}});
let timer;addEventListener('pointermove',()=>{document.body.classList.add('controls');clearTimeout(timer);timer=setTimeout(()=>document.body.classList.remove('controls'),2200)});setTimeout(()=>document.body.classList.remove('controls'),3200);addEventListener('hashchange',()=>{hashRead();render()});hashRead();render();
