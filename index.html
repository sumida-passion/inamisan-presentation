<script>
const slides=[{"theme": "dark", "kind": "hero", "label": "01 / 身近な疑問", "title": "卵。", "beats": ["その値段から、", "社会が見えてきた。"], "foot": "", "notes": "【発表原稿】\n今日は、卵の値上がりという身近な疑問から、私が考えたことをお話しします。調べる中で、生産だけでなく、餌や流通の仕組みまで考えるようになりました。", "original": ["卵の値上がりから考える", "買いやすい価格で", "生産者も、作り続けられる卵へ"], "mode": "solo"}, {"theme": "paper", "kind": "quiet", "label": "寮生活で感じたこと", "title": "いつもの卵が、", "beats": ["高くなっていた。", "なぜ？"], "foot": "", "notes": "【発表原稿】\n私は寮生活をしています。買い物で卵の値段を見て、以前より高くなったことが気になりました。身近な食材の値上がりが、今回調べようと思ったきっかけです。\n【事実の扱い】本人の体験はユーザー提供情報。「1年前より約100円」は購入時期・規格・店舗を示す記録が未確認のため、金額を断定していません。", "original": ["寮生活で感じた、値上がり", "いつもの買い物", "以前より高くなった卵", "なぜ、値段が上がったのか？"], "mode": "solo"}, {"theme": "paper", "kind": "numbers", "label": "価格を、確かめる", "title": "251 → 303", "beats": ["2024年9月 → 2025年9月", "1パック、52円の上昇。"], "foot": "全国平均・サイズ混合10個入り・税込。2024年9月と2025年9月の比較。", "notes": "【発表原稿】\n農林水産省の調査には、卵の小売価格が、2024年9月の251円から2025年9月には303円になった例がありました。サイズ混合の10個入りで、52円、約20.7％の上昇です。これは全国の調査店舗の平均であり、私が買った店の価格や、現在から1年前との比較ではありません。\n【出典】\n農林水産省「食品価格動向調査（食肉・鶏卵）」\nhttps://www.maff.go.jp/j/zyukyu/anpo/kouri/k_gyuniku/attach/pdf/index-59.pdf\n資料確認日：2026年10月6日", "original": ["公的な価格データでは", "2024年9月　251円", "2025年9月　303円", "1パックで52円の上昇", "全国平均・サイズ混合10個入り・税込。2024年9月と2025年9月の比較。"], "mode": "accumulate"}, {"theme": "red", "kind": "impact", "label": "最初の仮説", "title": "人手不足？", "beats": ["若い働き手が減っている。", "卵を作る人が、足りないのでは。"], "foot": "人手不足は、調査前に立てた仮説。", "notes": "【発表原稿】\n最初に考えたのは、養鶏場の人手不足です。少子化で若い働き手が減り、卵を作る人も足りなくなっているのではないか、と仮説を立てました。ただし、これは最初の仮説であり、人手不足が値上がりの主な原因だと確かめたわけではありません。", "original": ["最初の仮説", "養鶏場の人手不足？", "若い働き手が減っている？", "卵を作る人が足りないのでは？", "人手不足は、調査前に立てた仮説。"], "mode": "solo"}, {"theme": "dark", "kind": "stack", "label": "調べて、出会った言葉", "title": "原油価格。", "beats": ["ウクライナ情勢。", "海外の出来事が、なぜ卵に？"], "foot": "調査の途中で目にした説明。値上がりの原因は一つとは限らない。", "notes": "【発表原稿】\n調べ始めて目にしたのは、原油価格の上昇やウクライナ情勢など、海外に関わる説明でした。そこで、これは輸入する食品の話ではないのだろうか、と疑問に思いました。\n【事実の扱い】調査初期に目にした情報はユーザー提供の経緯です。現在の卵価格の主因を原油高や戦争だけに限定する説明ではありません。", "original": ["調べて、目にした説明", "原油価格", "ウクライナ情勢", "海外の出来事とのつながり", "調査の途中で目にした説明。値上がりの原因は一つとは限らない。"], "mode": "solo"}, {"theme": "paper", "kind": "numbers", "label": "卵は、国内生産中心", "title": "約95％", "beats": ["重量ベースの自給率。", "それなのに、なぜ海外の影響を？"], "foot": "約95％は過去の農水省掲載資料の概数。最新年度の値ではない。", "notes": "【演出】発表の約2分おきに見せ方を変えるための目安の場面。速度は話者が調整する。\n【発表原稿】\n私は店頭で外国産の卵をあまり見たことがありません。農林水産省に掲載された資料にも、卵の重量ベースの自給率は約95％と説明されていました。国内でこれほど生産している卵が、なぜ海外の影響を受けるのでしょうか。\n【出典】\n農林水産省掲載「食料の安定供給に係るリスク等に関する検討会」資料・図12\nhttps://www.maff.go.jp/j/zyukyu/anpo/attach/pdf/kentoukai-30.pdf\n資料確認日：2026年10月6日", "original": ["卵は、国内生産中心", "外国産の卵をあまり見ない", "重量ベースの自給率は約95％", "それなのに、なぜ海外の影響を？", "約95％は過去の農水省掲載資料の概数。最新年度の値ではない。"], "mode": "solo"}, {"theme": "paper", "kind": "stack", "label": "原因は、一つではない", "title": "コストと供給。", "beats": ["餌・資材などのコスト。", "鳥インフルエンザによる供給減。", "私は、海外とのつながりに注目した。"], "foot": "2025年度の高値について、農水省白書は供給減と堅調な需要を説明。", "notes": "【発表原稿】\n調べると、値上がりには、生産に必要な費用のほか、供給と需要の関係も関わると分かりました。農林水産省は2025年度の卵の高値について、鳥インフルエンザによる供給の減少と堅調な需要を挙げています。私は、その中でも海外とのつながりに注目しました。\n【出典】\n農林水産省「令和7年度 食料・農業・農村白書」第5章第5節\nhttps://www.maff.go.jp/j/wpaper/w_maff/r7/r7_h/trend/part1/chap5/c5_5_00.html\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["値上がりには、複数の要因", "餌や資材などのコスト", "鳥インフルエンザによる供給減", "私は、海外とのつながりに注目", "2025年度の高値について、農水省白書は供給減と堅調な需要を説明。"], "mode": "accumulate", "visual": "causes"}, {"theme": "dark", "kind": "impact", "label": "次の仮説", "title": "輸入すれば？", "beats": ["供給量が増える。", "価格競争が起こる。", "安く買えるようになるのでは。"], "foot": "輸入による値下がりは、検討段階の仮説。", "notes": "【発表原稿】\n一度は、海外から卵を輸入すればよいのではないかと考えました。供給が増え、価格競争が起これば、安く買えるかもしれません。ただし、この効果は輸入価格や数量、用途などの条件によって変わるため、ここでは検討する案です。", "original": ["それなら、卵を輸入？", "供給量を増やす", "価格競争が起こる", "安く買えるようになるのでは？", "輸入による値下がりは、検討段階の仮説。"], "mode": "accumulate"}, {"theme": "paper", "kind": "quiet", "label": "立ち止まって、考える", "title": "でも。", "beats": ["輸送費を含めても、安い？", "国内の生産者は、続けられる？"], "foot": "", "notes": "【発表原稿】\nしかし、輸入には輸送費もかかります。海外で安く買えても、日本の店頭まで運んだときに、本当に安くなるのでしょうか。また、安い輸入卵との競争で国内の生産者の利益が減り、生産を続けることが難しくなる可能性もあります。輸入すれば必ず安くなる、あるいは生産者が必ず廃業する、と決めつけることはできません。", "original": ["輸入案にも、疑問", "輸送費を含めても安い？", "国内の生産者への影響は？", "生産を続けられなくなったら？"], "mode": "solo"}, {"theme": "dark", "kind": "quiet", "label": "私が、実現したいこと", "title": "安い、その先へ。", "beats": ["おいしい国産の卵を、買いやすく。", "生産者も、続けられる価格で。"], "foot": "", "notes": "【発表原稿】\nここで、私が考えたいことがはっきりしました。おいしい国産の卵を、消費者が買いやすく、生産者も作り続けられる価格で届けるには、どうすればよいか。この問いを考えていきたいと思いました。", "original": ["私が、実現したいこと", "おいしい国産の卵を", "消費者が買いやすく", "生産者も続けられる価格で"], "mode": "solo"}, {"theme": "paper", "kind": "chain", "label": "もう一度、足元へ", "title": "卵。", "beats": ["鶏。", "餌。", "その餌は、どこから来る？"], "foot": "", "notes": "【発表原稿】\n私はもう一度、卵は国内で生産されているという点に戻りました。そして、卵そのものだけでなく、鶏が食べる餌に目を向けました。その餌まで国内で賄っているのでしょうか。", "original": ["卵の、その先を調べる", "卵を産むのは、鶏", "鶏を育てるのは、餌", "その餌は、どこから来る？"], "mode": "solo"}, {"theme": "red", "kind": "numbers", "label": "農林水産省の資料で見つけた", "title": "24％", "beats": ["日本全体の飼料自給率。", "令和7年度。畜産全体・TDNベース。"], "foot": "畜産全体の飼料・TDNベース。採卵鶏だけの自給率ではない。", "notes": "【発表原稿】\n農林水産省によると、令和7年度の日本全体の飼料自給率は24％です。これは鶏だけでなく、牛や豚などを含む畜産全体の数字です。卵は国内で生産していても、それを支える餌まで国内で賄っているとは限らないと気づきました。\n【数字の定義】飼料はTDN、可消化養分総量で換算。卵の重量ベース自給率とは対象・単位・年度が違い、二つを直接掛け算して卵の自給率を算出することはできません。\n【出典】\n農林水産省「食料自給率とは」令和7年度・飼料自給率\nhttps://www.maff.go.jp/j/zyukyu/zikyu_ritu/011.html\n資料確認日：2026年10月6日", "original": ["農林水産省の資料へ", "日本全体の飼料自給率", "24％", "令和7年度", "畜産全体の飼料・TDNベース。採卵鶏だけの自給率ではない。"], "mode": "solo"}, {"theme": "paper", "kind": "chart", "visual": "pie", "mode": "accumulate", "label": "卵1パックの向こう側 / 費用の積み上げ", "title": "餌代だけでは、ない。", "beats": ["餌代", "人件費", "運送・物流費", "スーパーの運営費", "その他の生産・卸の経費", "各段階のマージン"], "foot": "令和5年度・首都圏向けの事例。10個＝600gと仮定した税抜換算例。店頭実売価格・全国平均ではない。", "notes": "【演出】発表の約2分おきに見せ方を変えるための目安の場面。速度は話者が調整する。\n【発表原稿】卵1パックの価格には、餌だけでなく、人件費、運送費、お店を運営する費用も含まれます。農林水産省の事例調査を、10個で600gと仮定して換算しました。この推計では1パック225.8円に対して餌代は79.9円、約35.4％です。生産・集出荷段階の費用だけを見ると、餌代は約50.2％です。分母が違うので、この二つを混同しないようにします。餌代は大きい。でも、それだけを安くしても、価格全体が同じ割合で下がるわけではありません。だから、餌と流通を両方考えたいのです。\n【演出】約2分おきの見せ方の変化をつくる目安。餌代の一片から始め、6クリックで円全体を完成。完成後は少し止めて全体を見る。自動進行なし。\n【出典】農林水産省「鶏卵のコスト調査結果」令和5年度情報。生産・GPは企業アンケート、卸売・小売は推計を含む首都圏向け事例。生産規模に偏りがあり、全国平均ではない。売価376.3円/kgは推計で実際の価格ではない。税抜。\nhttps://www.maff.go.jp/j/shokusan/kikaku/kakaku_keisei/attach/pdf/imdex-159.pdf\n【計算】10個の総重量を600gと仮定し、円/kg×0.6。個数だけでは重量は決まらない。餌133.2円/kg。人件費25.1+4.7+31.6=61.4。輸送・物流13.8+7.8+6.7=28.3。スーパー運営（人件費・輸送費を除く）4.0+28.6=32.6。その他の生産・卸の経費96.6は、総額から既知の費目とマージンを差し引いた残差（丸め差を含む）。各段階マージン13.3+5.6+5.3=24.2。合計376.3。餌133.2/376.3=35.4％。生産・GP費用265.6に対して133.2/265.6=50.2％。\n【注意】マージンは資料の表示名称で、手取り利益を断定するものではない。2025年9月の303円パックとは時期・対象・重量・税込条件が違い、内訳を当てはめない。", "values": [133.2, 61.4, 28.3, 32.6, 96.6, 24.2], "colors": ["#ca3d26", "#203e53", "#698a88", "#d7ab52", "#999a90", "#69587b"]}, {"theme": "paper", "kind": "stack", "label": "国内の資源に、目を向ける", "title": "餌に、できないか。", "beats": ["規格外の野菜。", "食品加工で出る副産物。", "安く、安定して使えないか。"], "foot": "飼料への適性、栄養、安全性の確認が必要。", "notes": "【発表原稿】\nそこで、国内で手に入るものを、もっと安く餌として利用できないかと考えました。例えば規格外の野菜や、食品加工で出る副産物です。ただし、どの原料でもそのまま鶏の餌にできるわけではありません。必要な栄養、安全性、集まる量を確かめる必要があります。\n【出典】\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["国内の資源を、餌にできないか", "規格外の野菜", "食品加工で出る副産物", "安く、安定して使えないか？", "飼料への適性、栄養、安全性の確認が必要。"], "mode": "accumulate"}, {"theme": "dark", "kind": "impact", "label": "すでにある仕組み", "title": "エコフィード。", "beats": ["食品の副産物などを、飼料に。", "乾燥・発酵などで加工する。", "養鶏で、どう活用できるだろう。"], "foot": "加工方法によって対象家畜が異なる。採卵鶏への適用を確認する。", "notes": "【発表原稿】\nこうした食品の副産物などを利用する、エコフィードという取組がすでにあります。農林水産省の資料では、乾燥、発酵、液化などの方法が整理されています。ただし、方法によって適する家畜は異なります。私は、養鶏に合う原料と加工方法を調べたいと考えています。\n【出典】\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["すでにある、エコフィード", "食品の副産物などを飼料に", "乾燥・発酵などで加工", "養鶏で、どう活用できるか？", "加工方法によって対象家畜が異なる。採卵鶏への適用を確認する。"], "mode": "accumulate", "visual": "process"}, {"theme": "paper", "kind": "stack", "label": "原料が安ければ、それでいい？", "title": "届くまで、いくら。", "beats": ["集める。加工する。", "保管する。運ぶ。", "流通全体の費用を、考える。"], "foot": "", "notes": "【発表原稿】\n原料が安く手に入っても、集め、加工し、保管して、養鶏場まで運ぶ費用がかかります。さらに、国内で出る副産物でも、元の食品原料が輸入品なら、完全に海外依存がなくなるわけではありません。費用も原料の出どころも、全体を見る必要があります。\n【出典】\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["原料が安くても、費用はかかる", "集める・加工する", "保管する・運ぶ", "餌として届くまで、いくら？"], "mode": "accumulate", "visual": "costchain"}, {"theme": "paper", "kind": "quiet", "label": "濃縮果汁の発想から", "title": "水分を減らす？", "beats": ["運ぶ費用は、減るかもしれない。", "加工する費用は、増えるかもしれない。", "両方を比べて、確かめたい。"], "foot": "乾燥による節約効果は仮説。設備費・燃料費も含めて比較する。", "notes": "【発表原稿】\nここで思い浮かべたのが、濃縮果汁のように、水分を減らして運ぶという発想です。飼料も加工方法や運び方の工夫で費用を減らせるのではないでしょうか。ただし、乾燥には設備や燃料が必要です。農林水産省も、乾燥飼料は保存性に優れる一方、初期投資や加工費が大きいと説明しています。輸送費が下がっても、それ以上に加工費が増えれば、全体では安くなりません。\n【出典】\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["運び方を、変えられないか", "濃縮果汁の発想から", "水分を減らして運ぶ？", "加工費と輸送費を比べる", "乾燥による節約効果は仮説。設備費・燃料費も含めて比較する。"], "mode": "accumulate"}, {"theme": "dark", "kind": "roadmap", "label": "実現までの道筋", "title": "調べる。試す。広げる。", "beats": ["短期｜地域を調べる", "中期｜小規模に試す", "長期｜インフラを整える"], "foot": "私の検討案。調査 → 小規模実証 → 効果・採算の確認後にインフラ整備。", "notes": "【演出】ここは約2分おきの変化をつくる構成上の目安。3つのカードを1クリックずつ出し、全体像を残す。自動進行なし。\n\n【発表原稿】\n一度に全国の仕組みを変えることは難しいため、短期・中期・長期に分けて考えました。短期に条件を調べ、中期に実証し、その結果を基に長期の整備を判断するという道筋です。具体的な年数は、調査や試験に必要な期間を踏まえて考えます。\n\n【発表原稿】\n短期には、地域でどのような食品の副産物が、どれだけ、どの時期に出るかを調べます。食品工場と養鶏場の距離、現在の処理方法も確認します。まずは既存の設備で小規模な試験ができる協力先を探し、実現できそうな条件を絞りたいです。\n\n【発表原稿】\n中期には、協力する食品工場と養鶏場を絞り、専門家と栄養や安全性を確認したうえで、回収、加工、配送の仕組みを試します。今の方法と比べて費用が下がるか、産卵量や卵の品質を維持できるかも確かめます。餌1キロの価格だけでなく、卵を生産するための費用全体で判断したいです。\n\n【発表原稿】\n長期には、試験で効果が確認できた地域で、必要な加工、保管設備や共同配送の仕組みを整えます。設備だけでなく、品質基準、供給契約、費用を誰が負担するかも決める必要があります。大きな施設を造ることを目的にせず、必要な規模を見極め、補助が終わっても続けられるかを考えます。", "original": ["短期・中期・長期の道筋", "短期　地域を調べる", "中期　小規模に試す", "長期　効果のある仕組みを広げる", "以下は私の検討案。効果や採算は、これから確かめる。"], "mode": "accumulate", "visual": "plan", "cards": [["量・品質・距離を調査", "食品工場と養鶏場をつなぐ", "既存設備で試せる相手を探す"], ["専門家と栄養・安全性を確認", "回収・加工・配送を実証", "費用・産卵量・品質を比較"], ["加工・保管設備と共同配送", "品質基準・契約・費用分担", "効果を確認してから整備"]]}, {"theme": "paper", "kind": "quiet", "label": "まだ、答えを出せていない", "title": "だから、学びたい。", "beats": ["どれだけ集めれば、採算が合う？", "何キロ先まで、運べる？", "誰が投資し、どう利益を分ける？"], "foot": "", "notes": "【発表原稿】\nここまで考えましたが、どれだけの量を集めれば採算が合うのか、何キロ先まで運べるのか、設備費を誰が負担するのかは、まだ分かりません。地域内で利用する方法と、加工して広く運ぶ方法も比較したいです。また、生産費を下げられても、店頭価格にどう反映されるかは別に確かめる必要があります。", "original": ["大学で、確かめたい条件", "どれだけ集めれば採算が合う？", "何キロ先まで運べる？", "誰が投資し、どう利益を分ける？"], "mode": "accumulate"}, {"theme": "dark", "kind": "final", "label": "大学で、経済と流通を学ぶ", "title": "身近な疑問を、", "beats": ["実現可能な提案へ。", "消費者と生産者、両方の未来を考えたい。"], "foot": "", "notes": "【発表原稿】\n卵の値上がりを調べる中で、生産、貿易、飼料、物流がつながっていることを知りました。そして、比較すべき条件が見えてきました。大学では、経済や流通の仕組み、データを使って効果を確かめる方法を学びたいです。消費者と生産者の双方を考え、身近な疑問から生まれたこの問いを、実現可能な提案へと発展させたいと考えています。", "original": ["大学で、経済と流通を学びたい", "費用全体を、数字で比較する", "消費者と生産者の両方を考える", "身近な疑問を、実現可能な提案へ"], "mode": "solo"}, {"theme": "paper", "kind": "sources", "label": "根拠を示すことも、探究の一部", "title": "参考資料", "beats": ["農林水産省｜食品価格動向調査・白書", "農林水産省｜食料自給率・検討会資料", "農林水産省｜エコフィードをめぐる情勢"], "foot": "出典URLと数字の対象・期間は各スライドのノートに記載。", "notes": "【発表原稿】\n本発表で参照した資料です。各スライドのノートにも、該当する出典のURLと数字の意味を記載しています。短期・中期・長期の道筋は、資料に基づいて考えた私の検討案であり、効果が実証された計画ではありません。\n【出典】\n農林水産省「食品価格動向調査（食肉・鶏卵）」\nhttps://www.maff.go.jp/j/zyukyu/anpo/kouri/k_gyuniku/attach/pdf/index-59.pdf\n農林水産省掲載「食料の安定供給に係るリスク等に関する検討会」資料・図12\nhttps://www.maff.go.jp/j/zyukyu/anpo/attach/pdf/kentoukai-30.pdf\n農林水産省「食料自給率とは」令和7年度・飼料自給率\nhttps://www.maff.go.jp/j/zyukyu/zikyu_ritu/011.html\n農林水産省「令和7年度 食料・農業・農村白書」第5章第5節\nhttps://www.maff.go.jp/j/wpaper/w_maff/r7/r7_h/trend/part1/chap5/c5_5_00.html\n農林水産省「エコフィードをめぐる情勢」令和7年10月、冊子1・2・6・7・9頁\nhttps://www.maff.go.jp/j/chikusan/sinko/lin/l_siryo/attach/pdf/ecofeed-189.pdf\n資料確認日：2026年10月6日", "original": ["参考資料", "農林水産省　食品価格動向調査・白書", "農林水産省　食料自給率・検討会資料", "農林水産省　エコフィードをめぐる情勢", "出典URLと数字の対象・期間は各スライドのノートに記載。"], "mode": "accumulate"}];

function icon(name){return `<svg class="icon" viewBox="0 0 56 56" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`}
function sector(start,end){const xy=a=>[200+165*Math.cos(a),200+165*Math.sin(a)];const a=xy(start),b=xy(end);return `M200 200L${a.join(' ')}A165 165 0 ${end-start>Math.PI?1:0} 1 ${b.join(' ')}Z`}
function visual(s){if(s.visual==='pie'){let a=-Math.PI/2;const total=s.values.reduce((a,b)=>a+b,0);return `<div class="pie-layout"><div class="pie-wrap"><svg viewBox="0 0 400 400" role="img" aria-label="税抜推計価格225.8円の費目別構成。各項目は右の凡例に表示。"><circle cx="200" cy="200" r="165" fill="#e2dfd5"/>${s.values.map((v,i)=>{let end=a+v/total*Math.PI*2;let path=sector(a,end);a=end;return `<path class="slice reveal" data-reveal="${i+1}" d="${path}" fill="${s.colors[i]}"><title>${s.beats[i]} ${(v*.6).toFixed(1)}円 / ${(v/total*100).toFixed(1)}％</title></path>`}).join('')}<circle cx="200" cy="200" r="101" fill="#f2efe7"/><text x="200" y="180" text-anchor="middle" class="pie-small">10個＝600gの換算例</text><text x="200" y="222" text-anchor="middle" class="pie-number">225.8<tspan font-size="18"> 円</tspan></text><text x="200" y="252" text-anchor="middle" class="pie-small">税抜・推計</text></svg><p class="chart-caption reveal" data-reveal="1">餌代 <strong>79.9円 / 約35.4％</strong><br><span>生産・GP費用の中では約50.2％</span></p></div><div class="legend">${s.beats.map((b,i)=>`<div class="legend-row reveal" data-reveal="${i+1}"><i style="background:${s.colors[i]}"></i><span>${esc(b)}</span><strong>${(s.values[i]*.6).toFixed(1)}<small>円</small></strong><em>${(s.values[i]/total*100).toFixed(1)}％</em></div>`).join('')}<p class="legend-note reveal" data-reveal="6">餌と流通。両方を考える。</p></div></div>`}
if(s.visual==='plan')return `<div class="plan-grid">${s.beats.map((b,i)=>`<article class="plan-card reveal" data-reveal="${i+1}">${icon(['search','lab','factory'][i])}<small>0${i+1}</small><h3>${esc(b)}</h3><ul>${s.cards[i].map(t=>`<li>${esc(t)}</li>`).join('')}</ul></article>`).join('')}</div><div class="plan-gate reveal" data-reveal="3">調査 → 実証 → 効果・採算を確認 → インフラ整備</div>`;
const defs={causes:[['coin','餌・資材','コストが増える'],['shield','鳥インフルエンザ','供給が減る'],['search','私の注目点','海外とのつながり']],process:[['leaf','食品の副産物','飼料の原料へ'],['factory','乾燥・発酵','加工して使う'],['search','採卵鶏での適用','栄養・安全性を確認']],costchain:[['box','集める・加工する','原料価格だけで判断しない'],['truck','保管する・運ぶ','届くまでの費用を含める'],['coin','全体で比較','安さと継続性を確かめる']]};
return `<div class="explain-grid">${defs[s.visual].map((d,i)=>`<article class="explain-card reveal" data-reveal="${i+1}">${icon(d[0])}<h3>${esc(d[1])}</h3><p>${esc(d[2])}</p></article>`).join('')}</div>`;
}

function render(){const s=slides[index];stage.innerHTML=`<section class="slide ${s.theme} ${s.kind} ${s.mode||"accumulate"} ${s.visual?"has-visual":""}"><div class="eyebrow">${esc(s.label)}</div><span class="stamp">問いから、未来へ。 / INQUIRY</span><h1>${esc(s.title)}</h1>${s.visual?visual(s):`<div class="beats">${s.beats.map((b,i)=>`<p class="beat" data-beat="${i+1}">${esc(b)}</p>`).join('')}</div>`}<div class="foot">${esc(s.foot)}</div><div class="counter">${String(index+1).padStart(2,'0')} / ${slides.length}</div><div class="hint">クリック / → で次の言葉へ</div></section>`;requestAnimationFrame(()=>requestAnimationFrame(update));updateNotes();}
function update(){stage.querySelectorAll('[data-reveal]').forEach(el=>{const visible=+el.dataset.reveal<=step;el.classList.toggle('visible',visible);el.setAttribute('aria-hidden',String(!visible));});stage.querySelectorAll('.beat').forEach((el,i)=>{el.classList.toggle('shown',i<step);el.classList.toggle('past',i<step-1);el.classList.toggle('active',i===step-1);el.setAttribute('aria-hidden',String(i>=step));});document.querySelector('#progress').style.width=((index+step/(slides[index].beats.length+1))/slides.length*100)+'%';history.replaceState(null,'',`#${index+1}.${step}`);document.querySelector('#live').textContent=step?slides[index].beats[step-1]:slides[index].title;}
function next(){if(step<slides[index].beats.length){step++;update()}else if(index<slides.length-1){index++;step=0;render()}}
function prev(){if(step>0){step--;update()}else if(index>0){index--;step=slides[index].beats.length;render()}}
function updateNotes(){document.querySelector('#notes-title').textContent=`${String(index+1).padStart(2,'0')} / ${slides[index].title}`;document.querySelector('#notes-body').innerHTML=esc(slides[index].notes).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);}
function closePanels(){document.querySelectorAll('.panel.open').forEach(p=>p.classList.remove('open'));stage.inert=false;document.querySelector('nav').inert=false;if(lastFocus){lastFocus.focus();lastFocus=null}}
function panel(id){const p=document.getElementById(id);if(p.classList.contains('open'))return closePanels();closePanels();lastFocus=document.activeElement;p.classList.add('open');stage.inert=true;document.querySelector('nav').inert=true;p.querySelector('button').focus()}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{});}
stage.addEventListener('click',next);document.querySelector('#next').onclick=next;document.querySelector('#prev').onclick=prev;document.querySelector('#notes-btn').onclick=()=>panel('notes');document.querySelector('#overview-btn').onclick=()=>panel('overview');document.querySelector('#help-btn').onclick=()=>panel('help');document.querySelector('#fullscreen').onclick=fullscreen;document.querySelectorAll('.close').forEach(b=>b.onclick=closePanels);document.querySelector('#blackout').onclick=()=>document.querySelector('#blackout').classList.remove('open');
document.querySelector('#overview-list').innerHTML=slides.map((s,i)=>`<button data-slide="${i}"><small>${String(i+1).padStart(2,'0')} / ${esc(s.label)}</small>${esc(s.title)}</button>`).join('');document.querySelector('#overview-list').onclick=e=>{const b=e.target.closest('button');if(!b)return;index=+b.dataset.slide;step=0;closePanels();render()};
addEventListener('keydown',e=>{const key=e.key.toLowerCase(),open=document.querySelector('.panel.open');if(key==='escape'){closePanels();document.querySelector('#blackout').classList.remove('open');return}if(open){if(key==='tab'){const items=[...open.querySelectorAll('button,a')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(key==='b'){document.querySelector('#blackout').classList.toggle('open');return}if(document.querySelector('#blackout.open'))return;if(e.target.closest('button')&&[' ','enter'].includes(key))return;if(['arrowright',' ','pagedown'].includes(key)){e.preventDefault();next()}else if(['arrowleft','pageup'].includes(key)){e.preventDefault();prev()}else if(key==='n')panel('notes');else if(key==='o')panel('overview');else if(key==='f')fullscreen();else if(key==='?')panel('help');else if(key==='home'||key==='end'){index=key==='home'?0:slides.length-1;step=0;render()}});
let timer;addEventListener('pointermove',()=>{document.body.classList.add('controls');clearTimeout(timer);timer=setTimeout(()=>document.body.classList.remove('controls'),2200)});setTimeout(()=>document.body.classList.remove('controls'),3200);addEventListener('hashchange',()=>{hashRead();render()});hashRead();render();
</script></body></html>
